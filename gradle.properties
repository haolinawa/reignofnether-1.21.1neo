# Gradle JVM / build options
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=C:/jdk21

# ---- Network proxy (required in this sandboxed environment to reach Maven repos) ----
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=52522
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=52522
systemProp.http.nonProxyHosts=localhost|127.0.0.1

# ---- NeoForge 1.21.1 environment ----
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.255
neo_version_range=[21.1.0,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ---- Mod properties ----
mod_id=reignofnether
mod_name=Reign of Nether
mod_license=GNU GPLv3
mod_version=1.5.0-1.21.1-beta-27
mod_group_id=com.solegendary.reignofnether
mod_authors=SoLegendary
mod_description=Minecraft, except it's an RTS
